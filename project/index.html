<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SecureFace PAD Demo</title><style>body{font:16px system-ui;max-width:650px;margin:2em auto;padding:1em;background:#111827;color:#e5e7eb}button{padding:10px}video{width:100%;border-radius:8px}pre{white-space:pre-wrap;background:#1f2937;padding:16px;border-radius:8px}</style></head><body><h2>SecureFace AI — Image PAD Demo</h2><p>This is a single-frame anti-spoofing demo, not identity verification.</p><video id="v" autoplay playsinline muted></video><button onclick="check()">Analyze frame</button><pre id="status">Allow camera permission.</pre><canvas id="c" style="display:none"></canvas><script>let v=document.getElementById('v'), c=document.getElementById('c'), st=document.getElementById('status');navigator.mediaDevices.getUserMedia({video:true,audio:false}).then(s=>v.srcObject=s).catch(e=>st.textContent=e.message);function check(){if(!v.videoWidth){st.textContent='Camera not ready';return}c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(async blob=>{let fd=new FormData();fd.append('file',blob,'frame.jpg');st.textContent='Analyzing...';try{let r=await fetch('/predict',{method:'POST',body:fd});st.textContent=JSON.stringify(await r.json(),null,2)}catch(e){st.textContent=e.message}},'image/jpeg',.9)}</script></body></html>
